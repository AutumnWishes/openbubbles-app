name: Build OpenBubbles RCS Alpha

on:
  workflow_dispatch:
  pull_request:
    branches:
      - rustpush
    paths:
      - '.github/workflows/build.yml'
      - 'tools/full_app_build/**'
      - 'tools/rcs_bridge_harness/**'
      - 'android/**'
      - 'lib/**'
      - 'rust/**'
      - 'rust_builder/**'
      - 'rustpush'
      - 'telephony_plus'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'test/**'
      - '.env.example'
  push:
    branches:
      - rustpush
      - feature/full-openbubbles-sms
    paths:
      - '.github/workflows/build.yml'
      - 'tools/full_app_build/**'
      - 'tools/rcs_bridge_harness/**'
      - 'android/**'
      - 'lib/**'
      - 'rust/**'
      - 'rust_builder/**'
      - 'rustpush'
      - 'telephony_plus'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'test/**'
      - '.env.example'

concurrency:
  group: full-rcs-alpha-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Full OpenBubbles RCS alpha APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: 'true'
      BOT: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      GOTOOLCHAIN: local
      CGO_ENABLED: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.workers.max=2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch public submodules over HTTPS
        run: |
          git -c url.https://github.com/.insteadOf=git@github.com: submodule update --init --recursive
          git submodule status --recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache-dependency-path: tools/rcs_bridge_harness/bridge/go.sum
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Set up pinned Flutter SDK
        run: |
          git clone --depth 1 --branch 3.24.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = '80c2e84975bbd28ecf5f8d4bd4ca5a2490bfc819'
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --suppress-analytics --no-version-check --version
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android build packages
        run: sdkmanager 'platforms;android-36' 'build-tools;34.0.0' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Set up Rust and native build tools
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android --toolchain stable
          rustup run stable rustc --version
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler clang pkg-config libssl-dev ninja-build
      # Cache public dependency downloads only. Do not cache signing keys,
      # credentials, .env, application data, APKs, or native build outputs.
      - name: Restore Flutter package downloads
        id: pub_cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-openbubbles-pub-flutter3.24-${{ hashFiles('pubspec.lock', 'pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-openbubbles-pub-flutter3.24-
      - name: Restore Cargo dependency downloads
        id: cargo_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-openbubbles-cargo-deps-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-openbubbles-cargo-deps-
      - name: Restore Gradle dependency downloads
        id: gradle_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-openbubbles-gradle8.9-java21-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: ${{ runner.os }}-openbubbles-gradle8.9-java21-
      - name: Select alpha build number
        run: echo "ALPHA_BUILD_NUMBER=$((5000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Test and build the complete app
        run: tools/full_app_build/run.sh
      - uses: actions/upload-artifact@v4
        with:
          name: OpenBubbles-RCS-Alpha-arm64-test
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-rcsalpha-release.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
            build/app/outputs/flutter-apk/BUILD.txt
            build/app/outputs/flutter-apk/APK-CHECKS.txt
          if-no-files-found: error
      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OpenBubbles-RCS-Alpha-build-diagnostics
          path: |
            build/app/reports/
            build/app/test-results/
            tools/rcs_bridge_harness/android/app/build/reports/
            tools/rcs_bridge_harness/android/app/build/test-results/
          if-no-files-found: ignore
      # Keep dependency downloads after a failed compilation as well.
      - name: Save Flutter package downloads
        if: ${{ !cancelled() && steps.pub_cache.outputs.cache-hit != 'true' && steps.pub_cache.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.pub-cache
          key: ${{ steps.pub_cache.outputs.cache-primary-key }}
      - name: Save Cargo dependency downloads
        if: ${{ !cancelled() && steps.cargo_cache.outputs.cache-hit != 'true' && steps.cargo_cache.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.cargo_cache.outputs.cache-primary-key }}
      - name: Save Gradle dependency downloads
        if: ${{ !cancelled() && steps.gradle_cache.outputs.cache-hit != 'true' && steps.gradle_cache.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/dists
          key: ${{ steps.gradle_cache.outputs.cache-primary-key }}
